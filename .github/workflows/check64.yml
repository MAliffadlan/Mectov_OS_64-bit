name: check64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm binutils qemu-system-x86 \
            grub-common xorriso mtools python3 python3-pil e2fsprogs
          qemu-system-x86_64 --version | head -1
          ls /dev/kvm 2>/dev/null || echo "(no KVM: gates fall back to TCG)"

      - name: Full gate
        working-directory: .
        run: make check64

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: |
            serial*.log
            /tmp/shot_*.ppm
          if-no-files-found: warn
